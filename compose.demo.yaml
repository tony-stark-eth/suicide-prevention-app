---
# Demo deployment — password-gated, production build, real Postgres
# Usage: make demo-up
#
# Requires: .env.demo (copy from .env.demo.example and fill in secrets)

services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-demo
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    volumes:
      # Override the baked-in Caddyfile with the demo one (basicauth enabled)
      - ./frankenphp/Caddyfile.demo:/etc/frankenphp/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - geoip_data:/var/data
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEOIP_DB_PATH: /var/data/dbip-country-lite.mmdb
      FOLLOWUP_FROM_EMAIL: ${FOLLOWUP_FROM_EMAIL}
      FOLLOWUP_FROM_NAME: ${FOLLOWUP_FROM_NAME}
      APP_URL: ${APP_URL}
      SERVER_NAME: ${SERVER_NAME:-:80}
      # Basic auth
      DEMO_USERNAME: ${DEMO_USERNAME}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 30s

  mailer:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # View sent emails at http://<server-ip>:8025 (restrict in firewall for demo)
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  caddy_data:
  caddy_config:
  db_data:
  geoip_data:
